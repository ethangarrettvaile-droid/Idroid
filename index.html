<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDroid | Command Center</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="scanlines"></div>
    <div id="idroid">
        <header>
            <div class="logo">DIRECTIVE: MOTHER BASE</div>
            <div id="clock">00:00:00</div>
        </header>

        <nav>
            <div class="nav-group">
                <button onclick="setFilter('type', 'main')">MAIN</button>
                <button onclick="setFilter('type', 'side')">SIDE</button>
            </div>
            <div class="nav-group filters">
                <button id="btn-active" onclick="setFilter('status', 'active')">ACTIVE</button>
                <button id="btn-cleared" onclick="setFilter('status', 'cleared')">CLEARED</button>
                <button id="btn-trash" onclick="setFilter('status', 'trash')">TRASH</button>
            </div>
            <div class="nav-group">
                <select id="sort-select" onchange="setSort(this.value)">
                    <option value="created_at">DATE CREATED</option>
                    <option value="deadline">DEADLINE</option>
                </select>
            </div>
        </nav>

        <main id="mission-board">
            <div class="loading">ESTABLISHING UPLINK...</div>
        </main>

        <button id="toggle-creator" onclick="toggleCreator()">+ NEW INTEL</button>

        <section id="mission-creator" class="hidden">
            <h2 id="form-title">SUBMIT INTEL</h2>
            <input type="hidden" id="edit-id">
            <input type="text" id="task-title" placeholder="MISSION NAME...">
            <textarea id="task-desc" placeholder="OBJECTIVES..."></textarea>
            <input type="text" id="task-sub-input" placeholder="SUBTASKS (COMMA SEPARATED)...">
            
            <div class="form-row">
                <select id="task-prereq"><option value="">NO PREREQUISITE</option></select>
                <select id="task-type">
                    <option value="main">MAIN MISSION</option>
                    <option value="side">SIDE OP</option>
                </select>
            </div>
            <input type="date" id="task-deadline">
            <button class="deploy-btn" onclick="deployMission()">DEPLOY MISSION</button>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
