<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDroid | Command Center</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="scanlines"></div>
    <div id="idroid">
        <header>
            <div class="logo">DIRECTIVE: MOTHER BASE</div>
            <div id="clock">00:00:00</div>
        </header>

        <nav>
            <button onclick="loadMissions('main')">MAIN MISSIONS</button>
            <button onclick="loadMissions('side')">SIDE OPS</button>
        </nav>

        <main id="mission-board">
            <div class="loading">ESTABLISHING CONNECTION...</div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
