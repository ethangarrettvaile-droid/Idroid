<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDroid | Command Center</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="scanlines"></div>
    <div id="idroid">
        <header>
            <div class="logo">DIRECTIVE: MOTHER BASE</div>
            <div id="clock">00:00:00</div>
        </header>

        <nav>
            <button onclick="loadMissions('main')">MAIN MISSIONS</button>
            <button onclick="loadMissions('side')">SIDE OPS</button>
        </nav>

        <button id="toggle-creator" onclick="toggleCreator()">+ OPEN COMMS</button>

        <!-- ADDED: This is the missing piece the script was looking for -->
        <main id="mission-board">
            <div class="loading">ESTABLISHING CONNECTION...</div>
        </main>

<button id="toggle-creator" onclick="toggleCreator()">+ OPEN COMMS</button>

<section id="mission-creator" class="hidden">
    <h2>SUBMIT INTEL (NEW MISSION)</h2>
    <input type="text" id="task-title" placeholder="MISSION NAME...">
    <textarea id="task-desc" placeholder="OBJECTIVES..."></textarea>
    
    <div class="form-row">
        <input type="text" id="task-prereq" placeholder="PREREQUISITE ID (OPTIONAL)...">
        <input type="text" id="task-subtasks" placeholder="SUBTASKS (COMMA SEPARATED)...">
    </div>

    <div class="form-row">
        <select id="task-type">
            <option value="main">MAIN MISSION</option>
            <option value="side">SIDE OP</option>
        </select>
        <input type="date" id="task-deadline">
    </div>

    <button onclick="deployMission()">DEPLOY MISSION</button>
</section>
    </div>
    <script src="script.js"></script>
</body>
</html>
